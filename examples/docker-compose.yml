# Minimal two-service example: a dashboard at the root and one app
# behind a subpath. Enough to prove the pattern before adding the rest.
#
# The point of the network is that nginx reaches the services by NAME
# (sonarr, homarr). If you publish fixed host ports instead, drop the
# network and use 127.0.0.1:PORT in the nginx proxy_pass.

services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    ports:
      - "7575:7575"
    volumes:
      - ./homarr/config:/app/config
    networks:
      - proxy

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    volumes:
      - ./sonarr/config:/config
      - ./media/tv:/tv
    networks:
      - proxy
      # downloads: reaches qBittorrent by name, no need to publish it
      - downloads

networks:
  proxy:
  downloads:
    external: true
