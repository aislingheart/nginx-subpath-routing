# WebSocket upgrade map.
#
# Must be placed in the `http` context -- i.e. in nginx.conf itself, or in
# any file included from there such as /etc/nginx/conf.d/*.conf.
#
# It CANNOT go inside a server{} block. nginx will refuse to start with:
#   "map" directive is not allowed here
#
# Why this is needed: several of these apps (Prowlarr, qBittorrent, Homarr)
# hold a persistent websocket open for progress bars and job updates.
# Without the Upgrade/Connection headers the page loads but never updates,
# which looks like a broken app rather than a proxy problem.
#
# Why a map and not a literal "upgrade": Connection must be "close" for
# ordinary requests and "upgrade" only when the client actually asked to
# upgrade. Sending "upgrade" unconditionally breaks keep-alive and can
# leave connections hanging.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
