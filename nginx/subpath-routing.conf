############################################################
# nginx subpath routing for self-hosted services
#
# Serves many apps from ONE hostname on ONE port by putting each behind
# its own path prefix, e.g.
#
#   https://box.example.com/sonarr
#   https://box.example.com/jellyfin
#   https://box.example.com/
#
# Why bother: one port to open, one TLS certificate, one place to change
# later. The cost is that most apps assume they live at the root of a
# hostname and will generate links, redirect to, and fetch assets from
# absolute paths like /api/ or /static/.
#
# There are two ways to fix an app, in order of preference:
#
#   1. BASE URL      The app has a setting for this. Set it, done.
#                    (Sonarr, Radarr, Lidarr, Prowlarr, Bazarr, Jellyfin)
#   2. PATH REWRITE  The app has no such setting. Rewrite paths on the way
#                    through with sub_filter. (Open WebUI is the classic
#                    offender.)
#
# Only reach for (2) when (1) is not offered.
#
# HOW TO USE
# ----------
# This file contains location blocks, so it belongs INSIDE a server{}:
#
#   server {
#       listen 443 ssl;
#       server_name box.example.com;
#
#       # your TLS cert paths
#       ssl_certificate     /etc/letsencrypt/live/box.example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/box.example.com/privkey.pem;
#
#       include /etc/nginx/subpath-routing.conf;   <-- this file
#   }
#
# The `map` directive is the exception: map is only valid in the `http`
# context, so it must be placed in nginx.conf or a conf.d file that is
# included from there -- NOT inside a server block. Copy the map block
# from the top of this file into your http context, or use
# conf.d/00-websocket-map.conf from this repo, which is a separate file
# for exactly that reason.
############################################################


# --- Shared proxy headers ----------------------------------------------
# Set once, reused by every location below. Change it in one place.
#
#   Host               must be the real hostname, or apps build absolute
#                       URLs against "localhost" and redirect you there
#   X-Real-IP          your address, for logs and rate limiting
#   X-Forwarded-For    full client chain, for the same reason
#   X-Forwarded-Proto  so apps can tell they're behind TLS
#   Upgrade/Connection websocket passthrough (see the map in
#                       conf.d/00-websocket-map.conf)
#
# proxy_redirect off stops nginx rewriting upstream Location headers into
# absolute URLs, which would otherwise undo the subpath prefix.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_redirect off;

# Slow backends (Jellyfin transcoding, *arr imports) need generous timeouts
# or nginx returns 504 while the app is still working.
proxy_connect_timeout 60s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# Don't buffer large media streams to disk. Keeps Jellyfin and qBittorrent
# from writing multi-GB temp files.
proxy_request_buffering off;


############################################################
# Example 1: apps that support a Base URL setting
############################################################
# For these, nginx barely has to do anything. Set the app's own Base URL to
# "/sonarr" and match the prefix here.
#
# The trailing slash on proxy_pass is what strips the prefix. Without it,
# nginx forwards /sonarr/api/v3/series and the app receives a path it does
# not recognise, returning 404.

location /sonarr/ {
    proxy_pass http://sonarr:8989/;
}

location /radarr/ {
    proxy_pass http://radarr:7878/;
}

location /lidarr/ {
    proxy_pass http://lidarr:8686/;
}

location /prowlarr/ {
    proxy_pass http://prowlarr:9696/;
}

# Bazarr publishes a UI but is mostly driven by Sonarr/Radarr calling it,
# so the base URL has to match on both sides or subtitle sync silently
# fails with a 404 that looks like "Bazarr is down".
location /bazarr/ {
    proxy_pass http://bazarr:6767/;
}

############################################################
# Example 2: Jellyfin
############################################################
# Jellyfin also has a Base URL, but needs two extra things:
#
#  - a websocket location, because the playback UI reports progress over it
#  - Range requests passed through untouched, or seeking in a video stalls.
#    Dropping the range header is a common way to accidentally break this.

location /jellyfin/ {
    proxy_pass http://jellyfin:8096/;

    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
}

location /jellyfin/socket {
    proxy_pass http://jellyfin:8096/socket;
    proxy_http_version 1.1;
}

############################################################
# Example 3: qBittorrent
############################################################
# Also supports a Web UI base path, but the download client is reached by
# the *arr apps over plain HTTP on the container name, NOT through nginx.
# Point Sonarr/Radarr at http://qbittorrent:8080 directly. Only the web
# UI is proxied.

location /qbittorrent/ {
    proxy_pass http://qbittorrent:8080/;
}

############################################################
# Example 4: an app with NO base URL setting (Open WebUI)
############################################################
# This is the hard case, and the reason this file exists.
#
# Open WebUI hardcodes absolute paths in its HTML, CSS and JavaScript:
# it requests /_app/config.js, /static/logo.png, /api/models and so on.
# Mount it at /ai/ and every one of those requests goes to the wrong place,
# so the page renders blank with a console full of 404s.
#
# sub_filter rewrites those strings in the response body as it passes
# through. Three settings are all required, and forgetting any one of them
# fails in a way that makes it look like the others are broken:
#
#   sub_filter_types ...  which content types to rewrite. The default is
#                        text/html ONLY, so your JavaScript and CSS are
#                        left unrewritten and still 404.
#   sub_filter_once off  rewrite EVERY occurrence. The default rewrites
#                        only the first, so the page half-works: the
#                        first script loads and the rest do not.
#   Accept-Encoding ""   on the proxy_pass below.
#
# That last one is the non-obvious one. If the upstream sends gzipped
# content the body is binary and sub_filter cannot match text in it, so
# the rewrite silently does nothing. Clearing Accept-Encoding asks the
# upstream for plain text. The cost is that responses are no longer
# compressed on the way out.
#
# Note: this rewrites string literals in the response. It is a targeted
# fix for a known set of paths, not a general-purpose path rewriter. If
# the upstream changes how it builds URLs, expect to update these.

location /ai/ {
    proxy_pass http://open-webui:8080/;

    # Required for sub_filter to work at all -- see above.
    proxy_set_header Accept-Encoding "";

    sub_filter_types text/css application/javascript text/javascript application/json;
    sub_filter_once off;

    sub_filter '/_app/'   '/ai/_app/';
    sub_filter '/static/'  '/ai/static/';
    sub_filter '/api/'     '/ai/api/';
}

############################################################
# Example 5: a dashboard at the root
############################################################
# Homarr or Homepage at "/" is the simplest case, but it needs the root
# location to fall through to it rather than 404, and it usually wants
# websockets for its resource widgets.

location / {
    proxy_pass http://homarr:7575/;
}
